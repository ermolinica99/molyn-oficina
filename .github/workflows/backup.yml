name: Backup base de datos MOLYN

on:
  schedule:
    - cron: '0 3 * * *'   # todos los días a las 03:00 UTC
  workflow_dispatch: {}    # también se puede lanzar a mano desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17 (igual que el servidor de Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Volcar base de datos de Supabase
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL en la configuración del repositorio." >&2
            exit 1
          fi
          mkdir -p backups
          fecha=$(date +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges -F c -f "backups/molyn-$fecha.dump"

      - name: Subir backup como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: molyn-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 90
