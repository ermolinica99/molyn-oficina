<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLYN · Oficina</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1A17; --ink2:#33302A; --bg:#F4F2ED; --surf:#FFFFFF; --surf2:#EDEAE2;
  --terra:#B85C38; --terra-d:#9C4A2B; --green:#4C9A5E; --red:#C0492B; --blue:#5A7D8C;
  --muted:#9A948A; --border:#E4E0D8; --pur:#8A4B9C; --sidebar:#211F1B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--sidebar);color:#F4F2ED;flex-shrink:0;display:flex;flex-direction:column;padding:20px 14px}
.side .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
.side .brand img{width:38px;height:38px;border-radius:12px}
.side .brand .bt{font-weight:800;font-size:17px;letter-spacing:.5px}
.side .brand .bs{font-size:9px;color:#8F8A80;letter-spacing:1.5px;font-family:'Archivo Narrow'}
.side .grp{font-size:9px;color:#6f6a62;letter-spacing:1.5px;text-transform:uppercase;margin:16px 10px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;cursor:pointer;color:#C9C4BA;font-weight:600;font-size:14px;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:var(--terra);color:#fff}
.nav .ico{width:19px;height:19px;flex-shrink:0}
.side .conn{margin-top:auto;font-size:11px;color:#8F8A80;padding:10px 12px;background:rgba(0,0,0,.2);border-radius:10px}
.side .conn b{color:#C9C4BA;display:block;font-size:12px}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:64px;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0}
.top .crumb{color:var(--muted);font-size:13px}
.top .crumb b{color:var(--ink)}
.top .search{flex:1;max-width:420px;margin:0 auto}
.top .search input{width:100%;padding:10px 16px;border:1px solid var(--border);border-radius:11px;font-size:14px;font-family:inherit;background:var(--surf)}
.top .search input:focus{outline:none;border-color:var(--terra)}
.top .user{display:flex;align-items:center;gap:9px}
.top .user .av{width:34px;height:34px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

.content{flex:1;overflow-y:auto;padding:28px}
.h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.h1sub{color:var(--muted);font-size:14px;margin-top:2px;margin-bottom:22px}
.h2{font-size:18px;font-weight:800}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:18px 20px;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--terra);transform:translateY(-1px)}
.kpi.on{border-color:var(--terra);border-width:2px;padding:17px 19px}
.kpi .kh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kpi .kh .ki{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.kpi .kt{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.kpi .kd{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .kv{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .kbar{height:5px;border-radius:3px;background:var(--surf2);margin:11px 0 8px;overflow:hidden;display:flex}
.kpi .ksub{font-size:11px;color:var(--muted)}

/* programas */
.card{background:var(--surf);border:1px solid var(--border);border-radius:16px;margin-bottom:20px;overflow:hidden}
.card .ch{padding:16px 20px;border-bottom:1px solid var(--border)}
.card .ch .t{font-weight:800;font-size:15px}
.card .ch .s{font-size:12px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--border);cursor:pointer}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--surf2)}
.prow .ring{width:44px;height:44px;flex-shrink:0}
.prow .pc{font-family:'JetBrains Mono';font-weight:700;font-size:14px}
.prow .pc b{color:var(--terra)}
.prow .pn{color:var(--muted);font-size:13px;margin-left:6px}
.prow .pmeta{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);margin-top:2px}
.prow .badge{margin-left:auto;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px}
.badge.ok{background:#E4EDE6;color:var(--green)}
.badge.bad{background:#F7E1DC;color:var(--red)}

/* grid nucleos */
.gridhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surf2);border-radius:11px;padding:4px;gap:2px}
.seg button{border:none;background:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--surf);color:var(--ink)}
.chip{background:var(--terra);color:#fff;border:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.leg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.nc{background:var(--surf);border:1px solid var(--border);border-left:3px solid #d9d3c8;border-radius:14px;overflow:hidden}
.nc.diario{border-left-color:var(--terra)}
.nc.forz{border-left-color:var(--pur)}
.nc .nh{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nc .sku{font-family:'JetBrains Mono';font-weight:700;font-size:13px;word-break:break-all}
.nc .med{font-size:10px;color:var(--muted);text-transform:uppercase;font-family:'Archivo Narrow';letter-spacing:.5px;margin-top:3px}
.tag{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap;font-family:'Archivo Narrow'}
.tag.pers{background:#EDEAE2;color:var(--ink2)}
.tag.diario{background:#F5E7DF;color:var(--terra-d)}
.tag.forz{background:#EEE4F2;color:#7A3E8C}
.nc .nb{padding:14px 15px}
.nc .saldo{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.nc .saldo .big{font-family:'JetBrains Mono';font-size:34px;font-weight:800;letter-spacing:-1px}
.nc .saldo .big.zero{color:#CFC9BE}
.nc .saldo .sl{font-size:9px;color:var(--muted);text-transform:uppercase;font-family:'Archivo Narrow';letter-spacing:1px}
.nc .cells{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.nc .cell{background:var(--surf);padding:8px 4px;text-align:center}
.nc .cell .cv{font-family:'JetBrains Mono';font-size:15px;font-weight:700}
.nc .cell .ck{font-size:8px;color:var(--muted);text-transform:uppercase;font-family:'Archivo Narrow';margin-top:1px}
.nc .cell.disp .cv{color:var(--terra)} .nc .cell.pend .cv{color:var(--blue)}
.nc .plan{display:flex;gap:22px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--border)}
.nc .plan .pv{font-family:'JetBrains Mono';font-size:14px;font-weight:700}
.nc .plan .pk{font-size:8px;color:var(--muted);text-transform:uppercase;font-family:'Archivo Narrow'}
.nc .forzrow{margin-top:12px;padding-top:11px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.nc .forzrow label{font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.nc .forzrow input{width:17px;height:17px;accent-color:var(--terra);cursor:pointer}
.nc .lanzar{width:100%;margin-top:10px;background:var(--terra);color:#fff;border:none;padding:9px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.nc .lanzar:hover{background:var(--terra-d)}
.vacio{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:999}
.toast.show{opacity:1}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)}
.loading{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.ngrid{grid-template-columns:repeat(2,1fr)}.side{width:64px}.side .bt,.side .bs,.nav span,.side .grp,.side .conn{display:none}}
</style>
</head>

  <aside class="side">
    <div class="brand">
      <img id="logo" src="" alt="MOLYN">
      <div><div class="bt">MOLYN</div><div class="bs">NÚCLEOS · OFICINA</div></div>
    </div>
    <div class="grp">Operación</div>
    <button class="nav on"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></button>
    <div class="grp">Próximamente</div>
    <button class="nav" style="opacity:.5;cursor:default"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>Producción</span></button>

  </aside>

  <div class="main">
    <div class="top">
      <div class="crumb">MOLYN&nbsp;&nbsp;/&nbsp;&nbsp;<b>Dashboard</b></div>
      <div class="search"><input id="search" placeholder="Buscar SKU o nombre…"></div>
      <div class="user"><div class="av">OF</div><span style="font-size:13px;color:var(--muted)">Oficina</span></div>
    </div>
    <div class="content">
      <div class="h1">Dashboard</div>

      <div id="kpis" class="kpis"></div>
      <div id="progs"></div>
      <div class="gridhead">
        <div class="h2" id="gridTitle">Núcleos</div>
        <div class="mono" id="gridCount" style="color:var(--muted);font-weight:600"></div>
        <div id="gridFilter"></div>
        <div style="flex:1"></div>
        <div class="leg"><i style="background:var(--terra)"></i>Disponible</div>
        <div class="leg"><i style="background:var(--blue)"></i>Madurando</div>
        <div class="leg"><i style="background:#C4BDB0"></i>Fabricando</div>
      </div>
      <div id="grid" class="ngrid"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://kmfdywyeesybqqfmfxys.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttZmR5d3llZXN5YnFxZm1meHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTA0MDMsImV4cCI6MjA5OTgyNjQwM30.dDrPPvqxqWBqFTA5FNC3YLAVK53nm8V2tn5JKHN9ve4";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');setTimeout(()=>e.className='toast',1900)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const PROG_DESC={N001:'Extra Firm',N002:'040',N003:'030',N004:'V50',N005:'Medium',N006:'V65/32',N007:'V65/40',N008:'V80 Soft',N009:'V80/40',N010:'Abatible',N011:'Kids',N012:'Articulado'};
function progDe(p){const m=(p.descripcion||p.sku||'').match(/(N\d{3})/);return m?m[1]:'—'}
function medida(sku){const rest=String(sku||'').replace(/^N\d{3}/,'');const m=rest.match(/(\d{2,3})\s*[xX]\s*(\d{3})/);return m?`Medida ${m[1]} × ${m[2]}`:''}

let CFG={dias_historico:5,umbral_semanal:2.0,maduracion:2};
let MET={};        // sku -> métrica
let FILTRO='todos';
let KPI=null;      // 'stock'|'bajo'|'neg'
let PROG=null;

// ---- carga de datos ----
async function cargarConfig(){
  try{const {data}=await sb.from('config').select('*').eq('id',1).single();
    if(data){CFG.dias_historico=data.dias_historico??5;CFG.umbral_semanal=parseFloat(data.umbral_semanal??2);CFG.maduracion=data.maduracion??2;}}catch(e){}
}
async function selectAll(table,cols){
  let out=[],from=0,size=1000;
  while(true){
    const {data,error}=await sb.from(table).select(cols).range(from,from+size-1);
    if(error)throw error;
    out=out.concat(data||[]);
    if(!data||data.length<size)break;
    from+=size;
  }
  return out;
}
async function calcularMetricas(){
  const now=new Date();
  const mad=CFG.maduracion, diasH=CFG.dias_historico, umbral=parseFloat(CFG.umbral_semanal);
  let prods;
  try{prods=await selectAll('productos','sku,nombre,descripcion,forzar_diario');}
  catch(e){prods=await selectAll('productos','sku,nombre,descripcion');}
  const uds=await selectAll('unidades','sku,estado,fabricada_at,consumida_at');
  let res=[];try{res=await selectAll('reservas','sku,cantidad,estado');res=res.filter(r=>r.estado==='pendiente'||r.estado==null);}catch(e){}
  const pend={};res.forEach(r=>{pend[r.sku]=(pend[r.sku]||0)+(r.cantidad||0)});

  const m={};
  prods.forEach(p=>{m[p.sku]={sku:p.sku,nombre:p.nombre||'',prog:progDe(p),stock:0,disp:0,madurando:0,fabricando:0,dias:{},cons28:0,forzado:!!p.forzar_diario};});
  uds.forEach(u=>{
    const b=m[u.sku];if(!b)return;
    if(u.estado==='pendiente')b.fabricando++;
    else if(u.estado==='stock'){b.stock++;
      const fab=u.fabricada_at?new Date(u.fabricada_at):null;
      if(fab&&(now-fab)/1000>=mad*86400)b.disp++;else b.madurando++;
    }else if(u.estado==='consumida'&&u.consumida_at){
      const ca=new Date(u.consumida_at),day=u.consumida_at.slice(0,10);
      b.dias[day]=(b.dias[day]||0)+1;
      if((now-ca)/1000<=28*86400)b.cons28++;
    }
  });
  Object.values(m).forEach(b=>{
    const ds=Object.keys(b.dias).sort().reverse().slice(0,diasH);
    const tot=ds.reduce((s,d)=>s+b.dias[d],0);
    b.Dreal=ds.length?Math.round(tot/ds.length*100)/100:0;
    b.D=b.forzado?Math.max(b.Dreal,umbral):b.Dreal;
    b.pend=pend[b.sku]||0;
    b.saldo=b.disp+b.madurando+b.fabricando-b.pend;
    b.personalizado=b.forzado?false:(b.D<umbral);
    b.ROP=Math.ceil(b.D*mad);
    b.bajoMin=(!b.personalizado)&&b.saldo<b.ROP;
    b.reponer=b.bajoMin?(b.ROP-b.saldo):0;
  });
  return m;
}

// ---- forzar diario ----
async function toggleForzado(sku,val){
  try{
    const {error}=await sb.from('productos').update({forzar_diario:val}).eq('sku',sku);
    if(error)throw error;
    const b=MET[sku];const umbral=parseFloat(CFG.umbral_semanal),mad=CFG.maduracion;
    b.forzado=val;b.D=val?Math.max(b.Dreal,umbral):b.Dreal;
    b.personalizado=val?false:(b.D<umbral);
    b.ROP=Math.ceil(b.D*mad);b.bajoMin=(!b.personalizado)&&b.saldo<b.ROP;b.reponer=b.bajoMin?(b.ROP-b.saldo):0;
    toast(val?'★ Forzado a diario: '+sku:'Marca quitada: '+sku,'ok');
    render();
  }catch(e){toast('No se pudo guardar. ¿Ejecutaste forzar_diario.sql? '+(e.message||''),'err');}
}

// ---- filtros ----
function setKpi(k){KPI=(KPI===k)?null:k;PROG=null;render()}
function setProg(p){PROG=(PROG===p)?null:p;KPI=null;render()}
function clearF(){KPI=null;PROG=null;FILTRO='todos';render()}
function setFiltro(f){FILTRO=f;render()}

function filtrar(){
  let rs=Object.values(MET);
  const q=$('#search').value.toLowerCase().trim();
  if(q)return rs.filter(b=>b.sku.toLowerCase().includes(q)||(b.nombre||'').toLowerCase().includes(q)).sort((a,b)=>a.sku.localeCompare(b.sku));
  if(KPI==='stock'){rs=rs.filter(b=>(b.disp+b.madurando)>0).sort((a,b)=>(b.disp+b.madurando)-(a.disp+a.madurando)||a.sku.localeCompare(b.sku));return rs}
  if(KPI==='bajo'){rs=rs.filter(b=>b.bajoMin).sort((a,b)=>a.sku.localeCompare(b.sku));return rs}
  if(KPI==='neg'){rs=rs.filter(b=>b.saldo<0).sort((a,b)=>a.saldo-b.saldo);return rs}
  if(PROG){rs=rs.filter(b=>b.prog===PROG).sort((a,b)=>(a.bajoMin?0:1)-(b.bajoMin?0:1)||a.sku.localeCompare(b.sku));return rs}
  if(FILTRO==='bajo')rs=rs.filter(b=>b.bajoMin);
  else if(FILTRO==='diarios')rs=rs.filter(b=>!b.personalizado);
  else if(FILTRO==='pers')rs=rs.filter(b=>b.personalizado);
  return rs.sort((a,b)=>(a.bajoMin?0:1)-(b.bajoMin?0:1)||a.sku.localeCompare(b.sku));
}

// ---- ring svg ----
function ring(disp,madur,fab,size){
  const tot=Math.max(disp+madur+fab,1),r=size/2-4,c=2*Math.PI*r,cx=size/2;
  const dl=disp/tot*c,ml=madur/tot*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EDEAE2" stroke-width="3"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--terra)" stroke-width="3" stroke-dasharray="${dl} ${c}" transform="rotate(-90 ${cx} ${cx})"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#C4BDB0" stroke-width="3" stroke-dasharray="${ml} ${c}" stroke-dashoffset="${-dl}" transform="rotate(-90 ${cx} ${cx})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono" font-size="${size*0.28}" font-weight="700" fill="${disp?'var(--terra)':'#CFC9BE'}">${disp}</text>
  </svg>`;
}

// ---- render ----
function render(){
  const arr=Object.values(MET);
  const disp=arr.reduce((s,b)=>s+b.disp,0),madur=arr.reduce((s,b)=>s+b.madurando,0),fab=arr.reduce((s,b)=>s+b.fabricando,0);
  const bajo=arr.filter(b=>b.bajoMin),negs=arr.filter(b=>b.saldo<0);
  const stock=disp+madur,defi=negs.reduce((s,b)=>s+b.saldo,0);

  // KPIs
  const kpi=(id,ic,tint,col,tit,val,unit,sub,delta,bars,vcol)=>`
    <div class="kpi ${KPI===id?'on':''}" onclick="${id==='fab'?'go2()':`setKpi('${id}')`}">
      <div class="kh"><div class="ki" style="background:${tint}">${ic}</div>
        <div class="kt" style="color:${col}">${tit}</div><div class="kd">${delta||''}</div></div>
      <div class="kv" style="${vcol?'color:'+vcol:''}">${val} <small>${unit}</small></div>
      <div class="kbar">${bars}</div><div class="ksub">${sub}</div>
    </div>`;
  const bar=(f,c)=>`<div style="width:${Math.min(f*100,100)}%;background:${c}"></div>`;
  $('#kpis').innerHTML=
    kpi('stock',svgIco('box','var(--terra)'),'#F5E7DF','var(--terra)','En stock',stock,'uds',`${disp} disponibles · ${madur} madurando`,arr.length+' ref',bar(disp/Math.max(stock,1),'var(--terra)')+bar(madur/Math.max(stock,1),'var(--blue)'))+
    kpi('fab',svgIco('gear','var(--green)'),'#E4EDE6','var(--green)','En fabricación',fab,'uds','Pendientes en OT abiertas','OT',bar(.5,'var(--green)'))+
    kpi('bajo',svgIco('warn','var(--red)'),'#F7E1DC','var(--red)','Bajo mínimo',bajo.length,'núcleos',`De ${arr.length} referencias activas`,'reponer',bar(bajo.length/Math.max(arr.length,1),'var(--red)'),'var(--red)')+
    kpi('neg',svgIco('down','var(--pur)'),'#EEE4F2','var(--pur)','Saldo negativo',defi,'uds de déficit',`Repartido en ${negs.length} núcleos`,negs.length+' ref',bar(.34,'var(--pur)'),'var(--pur)');

  // programas
  const pg={};
  arr.forEach(b=>{const g=pg[b.prog]||(pg[b.prog]={prog:b.prog,n:0,disp:0,madur:0,fab:0,bajo:0});g.n++;g.disp+=b.disp;g.madur+=b.madurando;g.fab+=b.fabricando;g.bajo+=b.bajoMin?1:0;});
  const progList=Object.values(pg).sort((a,b)=>a.prog.localeCompare(b.prog));
  $('#progs').innerHTML=`<div class="card"><div class="ch"><div class="t">Programas</div><div class="s">Stock por familia de núcleo · toca para filtrar</div></div>
    ${progList.map(g=>`<div class="prow" onclick="setProg('${g.prog}')">
      ${ring(g.disp,g.madur,g.fab,44)}
      <div><div><span class="pc"><b>${g.prog[0]}</b>${g.prog.slice(1)}</span><span class="pn">${esc(PROG_DESC[g.prog]||'')}</span></div>
      <div class="pmeta">${g.n} ref · ${g.disp} disp · ${g.fab} fab</div></div>
      <span class="badge ${g.bajo?'bad':'ok'}">${g.bajo?g.bajo+' bajo mín.':'Correcto'}</span></div>`).join('')}</div>`;

  // grid header
  let titulo='Núcleos';
  if(KPI==='stock')titulo='Núcleos en stock';else if(KPI==='bajo')titulo='Núcleos bajo mínimo';
  else if(KPI==='neg')titulo='Núcleos con saldo negativo';else if(PROG)titulo='Programa '+PROG;
  $('#gridTitle').textContent=titulo;
  const rs=filtrar();
  $('#gridCount').textContent=rs.length;
  $('#gridFilter').innerHTML=(KPI||PROG)
    ? `<button class="chip" style="background:var(--surf2);color:var(--ink)" onclick="clearF()">✕ Quitar filtro</button>`
    : `<div class="seg">${[['todos','Todos'],['bajo','Bajo mínimo'],['diarios','Diarios'],['pers','Personalizados']].map(([k,t])=>`<button class="${FILTRO===k?'on':''}" onclick="setFiltro('${k}')">${t}</button>`).join('')}</div>`;

  // tarjetas
  $('#grid').innerHTML=rs.length?rs.map(cardN).join(''):'<div class="vacio">No hay núcleos que cumplan este filtro.</div>';
}

function cardN(b){
  const forz=b.forzado;
  const cls=forz?'forz':(b.personalizado?'':'diario');
  const tag=forz?'<span class="tag forz">Diario (forzado)</span>':(b.personalizado?'<span class="tag pers">Personalizado</span>':'<span class="tag diario">Diario</span>');
  const med=medida(b.sku)||esc(b.nombre||'');
  return `<div class="nc ${cls}">
    <div class="nh"><div><div class="sku">${esc(b.sku)}</div><div class="med">${esc(med)}</div></div>${tag}</div>
    <div class="nb">
      <div class="saldo"><span class="big ${b.saldo<=0?'zero':''}">${b.saldo}</span><span class="sl">SALDO<br>uds en total</span></div>
      <div class="cells">
        <div class="cell disp"><div class="cv">${b.disp}</div><div class="ck">Disp</div></div>
        <div class="cell"><div class="cv">${b.madurando}</div><div class="ck">Madur</div></div>
        <div class="cell"><div class="cv">${b.fabricando}</div><div class="ck">Fabr</div></div>
        <div class="cell pend"><div class="cv">${b.pend}</div><div class="ck">Pend</div></div>
      </div>
      <div class="plan">
        <div><div class="pv">${b.D||'—'}</div><div class="pk">Cons/día</div></div>
        <div><div class="pv">${b.personalizado?'—':b.ROP}</div><div class="pk">P. pedido</div></div>
      </div>
      <div class="forzrow"><label><input type="checkbox" ${forz?'checked':''} onchange="toggleForzado('${b.sku.replace(/'/g,"\\'")}',this.checked)">Forzar a diario</label></div>
      ${b.saldo<0?`<button class="lanzar" onclick="toast('Para lanzar a producción usa la app de escritorio (próximamente en web)','')">⟳ Déficit: ${Math.abs(b.saldo)} uds</button>`:''}
    </div></div>`;
}

function svgIco(n,c){
  const P={box:"<path d='M21 8l-9-5-9 5v8l9 5 9-5V8z'/><path d='M3 8l9 5 9-5'/><path d='M12 13v8'/>",
    gear:"<path d='M23 4v6h-6'/><path d='M20.49 15a9 9 0 1 1-2.12-9.36L23 10'/>",
    warn:"<path d='M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z'/><line x1='12' y1='9' x2='12' y2='13'/><line x1='12' y1='17' x2='12.01' y2='17'/>",
    down:"<path d='M12 5v14M19 12l-7 7-7-7'/>"};
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
}
function go2(){toast('Órdenes de trabajo: próximamente en web','')}

// ---- arranque ----
async function boot(){
  try{
    $('#conn').innerHTML='<b>Cargando…</b>Supabase';
    await cargarConfig();
    MET=await calcularMetricas();
    $('#conn').innerHTML='<b>Conectado</b>'+Object.keys(MET).length+' núcleos';
    render();
  }catch(e){
    $('#conn').innerHTML='<b>Error de conexión</b>'+esc(e.message||'');
    $('#grid').innerHTML='<div class="vacio">Error al cargar: '+esc(e.message||e)+'</div>';
  }
}
$('#search').addEventListener('input',render);
$('#logo').src='data:image/png;base64,'+LOGO_B64;
boot();
</script>
</body></html>
